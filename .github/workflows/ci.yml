name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand: the Admin page's Test Results tab (Run in CI, through the dev server's local results service), the
  # Actions page, or `gh workflow run ci.yml --ref main`. Runs the same test job (every Cucumber test, offline and in the
  # browser), stores its results in R2, then the live smoke check (straight away: no Cloudflare build to wait for).
  workflow_dispatch:
    inputs:
      source:
        description: Where the run was started from (Run in CI passes the Admin page's host, e.g. localhost:4321)
        required: false
        default: ''

# A newer push cancels the older run of the same branch. Runs started by hand have their own group, so one never
# cancels a push's run (or the reverse).
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder Web3Forms keys: the release-build guard and the contact-form tests need keys
      # that look real, but the tests never send anything, so these are not secrets and are not
      # the production keys (those live in Cloudflare's build settings).
      PUBLIC_WEB3FORMS_KEY: 00000000-0000-4000-8000-000000000001
      PUBLIC_WEB3FORMS_KEY_ES: 00000000-0000-4000-8000-000000000002
      # Optional: with these two secrets set, every run's reports are stored in R2 (bucket
      # photography-site-test, under results/). Without them that step is skipped. See the README.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        # `npm run lint`'s own `prelint` hook runs `astro sync` first: ESLint's type-aware rules need the
        # `astro:content` ambient types it writes to .astro/ (gitignored, so a fresh checkout has none yet).
        run: npm run lint
      - name: Type-check
        run: npx astro check
      - name: Install the browser for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Tests (build output, tooling and logic; no network needed)
        run: npm test -- --format json:test-results/offline.json --format html:test-results/offline.html
      - name: Browser tests (real Chromium)
        run: npm run test:browser -- --format json:test-results/browser.json --format html:test-results/browser.html
      - name: Dependency audit
        # npm audit, failing on any high or critical advisory except those accepted for a written reason until a fix
        # exists (scripts/audit.mjs: each names its issue, e.g. #22).
        run: npm run audit
      - name: Store the test results in R2 (only when the R2 secrets are configured)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' }}
        # The run's source: the host that started it by hand (Run in CI), else (empty) the publisher names the GitHub
        # event ("GitHub push", "GitHub pull request", "GitHub manual run"). Passed as an environment variable, never
        # pasted into the command, so the input is only ever text.
        env:
          RESULTS_FROM: ${{ inputs.source }}
          RESULTS_TARGET: GitHub CI
        run: node scripts/results.mjs publish --source ci

  # After Cloudflare's Git build has had time to finish, check the live site the way a visitor
  # would. This catches a build that deployed without the contact-form keys.
  # On pushes to main (after Cloudflare's build) and on runs started by hand (Run in CI), once the tests have passed.
  live-smoke:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Cloudflare's build to finish
        # A push to main starts Cloudflare's build; a run started by hand checks the site as it is now.
        if: ${{ github.event_name == 'push' }}
        run: sleep 300
      - name: Smoke-check the live site
        run: node scripts/smoke.mjs --wait --timeout 180
