name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder Web3Forms keys: the release-build guard and the contact-form tests need keys
      # that look real, but the tests never send anything, so these are not secrets and are not
      # the production keys (those live in Cloudflare's build settings).
      PUBLIC_WEB3FORMS_KEY: 00000000-0000-4000-8000-000000000001
      PUBLIC_WEB3FORMS_KEY_ES: 00000000-0000-4000-8000-000000000002
      # Optional: with these two secrets set, every run's reports are stored in R2 (bucket
      # photography-site-test, under results/). Without them that step is skipped. See the README.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx astro check
      - name: Install the browser for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Tests (build output, tooling and logic; no network needed)
        run: npm test -- --format json:test-results/offline.json --format html:test-results/offline.html
      - name: Browser tests (real Chromium)
        run: npm run test:browser -- --format json:test-results/browser.json --format html:test-results/browser.html
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Store the test results in R2 (only when the R2 secrets are configured)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/results.mjs publish --source ci

  # After Cloudflare's Git build has had time to finish, check the live site the way a visitor
  # would. This catches a build that deployed without the contact-form keys.
  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Cloudflare's build to finish
        run: sleep 300
      - name: Smoke-check the live site
        run: node scripts/smoke.mjs --wait --timeout 180
