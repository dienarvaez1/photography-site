name: Lighthouse

# Measures the live site with the Lighthouse suite and stores the run in R2 (bucket photography-site-test, under
# lighthouse-results/), where the Admin page's Lighthouse Test Results tab shows it. Started by hand: from the Actions
# page, or with `gh workflow run lighthouse.yml`. (The tab's "Run in Production" button measures the same site from
# the owner's computer instead, through the dev server's local results service.) A run whose pages miss their budgets
# is still stored (that is what the tab is for); the job then fails so the run shows red here too.
on:
  workflow_dispatch:

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Needed to store the run; without them the measurements still run but nothing is published.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the browser Lighthouse drives
        run: npx playwright install --with-deps chromium
      - name: Measure the live site and store the run in R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run test:lighthouse:record
      - name: Measure the live site (not stored; the R2 secrets are not configured)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: npm run test:lighthouse:record -- --no-publish
      - name: Keep the reports with the run
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
