name: Live smoke check

# Checks the live site every six hours (and on demand): pages, both contact forms, photos in R2,
# the 404 page, robots.txt, hreflang and security headers. A failing run emails the repo owner.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Optional: with these two secrets set, each check's result is stored in R2 (bucket
      # photography-site-test, under results/). Without them that step is skipped.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke.mjs --out test-results/smoke.json
      - name: Install wrangler to store the result (only when the R2 secrets are configured)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci
      - name: Store the result in R2 (only when the R2 secrets are configured)
        if: ${{ always() && env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/results.mjs publish --source ci
