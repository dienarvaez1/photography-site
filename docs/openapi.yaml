    # --- Photo service ------------------------------------------------------------------------------------------------
    CategoryOrder:
      type: object
      required: [count, max, next]
      properties:
        count: { type: integer, description: Photos in the category. }
        max: { type: number, description: The highest order used. }
        next: { type: number, description: The order a new photo gets by default. }

    PhotoAnalysis:
      type: object
      required: [id, width, height, camera, takenAt, inCategories]
      properties:
        id: { $ref: '#/components/schemas/PhotoId' }
        width: { type: integer }
        height: { type: integer }
        camera: { type: [string, 'null'], description: The camera line from EXIF. }
        takenAt:
          oneOf:
            - $ref: '#/components/schemas/TakenAt'
            - type: 'null'
        inCategories: { type: array, items: { type: string }, description: Categories that already have this exact photo. }

    AddedPhoto:
      type: object
      required: [path, key, entry, id, width, height, camera, order]
      properties:
        path: { type: string, description: 'The entry''s file in the local mirror, e.g. `astro/images/<id>.md`.' }
        key: { type: string, description: 'The entry''s key in the public bucket, e.g. `photos/categories/astro/<id>.md`.' }
        entry: { type: string, description: 'The entry''s full Markdown text, as published.' }
        id: { $ref: '#/components/schemas/PhotoId' }
        width: { type: integer }
        height: { type: integer }
        camera: { type: [string, 'null'] }
        order: { type: number }

    PhotoInCategory:
      type: object
      required: [id, category]
      description: One entry — a photo can be filed in more than one category, so the category says which.
      properties:
        id: { $ref: '#/components/schemas/PhotoId' }
        category: { type: string }

    # --- Category service ---------------------------------------------------------------------------------------------
    Category:
      type: object
      required: [slug, hidden, label, labelEs, description, descriptionEs, photoCount]
      properties:
        slug: { $ref: '#/components/schemas/CategorySlug' }
        hidden: { type: boolean }
        label: { type: string, description: English name. }
        labelEs: { type: string, description: Spanish name. }
        description: { type: string }
        descriptionEs: { type: string }
        photoCount: { type: integer }
